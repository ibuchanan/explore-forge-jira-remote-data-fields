app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/91e76e8d-752b-417d-8586-71679349e07b
environment:
  variables:
    - REMOTE_BASE_URL
modules:
  # See: https://developer.atlassian.com/platform/forge/manifest-reference/endpoint
  endpoint:
    - key: remote-data-fields-api
      remote: data-fields-remote
  function:
    - key: copy-form-state-on-create
      handler: triggers.copyFormStateOnCreate
  # Copies form state captured at creation, by the create dialog's custom field
  # or the portal request-create panel, to the issue property that the
  # post-create panels read and write.
  trigger:
    - key: copy-form-state-on-create
      function: copy-form-state-on-create
      events:
        - avi:jira:created:issue
  # One field hosts the whole remote form in the Jira create dialog; its value
  # is the form state. Admins add it to create screens and mark it required.
  jira:customField:
    - key: remote-data-fields-value
      name: Remote data fields
      description: Answers to the remote data-field form, captured when the issue is created.
      type: object
      resolver:
        endpoint: remote-data-fields-api
      schema:
        type: object
      view:
        experience:
          - issue-view
        formatter:
          expression: "value == null ? '' : value.entries().map(e => e[0] + ': ' + (e[1] != null ? e[1] : 'No value')).join(', ')"
      edit:
        resource: remote-data-fields-ui
        experience:
          - issue-create
  jira:issueContext:
    - key: remote-data-fields
      resource: remote-data-fields-ui
      resolver:
        endpoint: remote-data-fields-api
      title: Remote data fields
      label: Remote data fields
  jiraServiceManagement:portalRequestCreatePropertyPanel:
    - key: remote-data-fields-portal-create
      resource: remote-data-fields-ui
      resolver:
        endpoint: remote-data-fields-api
      unlicensedAccess:
        - customer
  # Read-only: shows the request property captured by the create panel.
  jiraServiceManagement:portalRequestDetail:
    - key: remote-data-fields-portal
      resource: remote-data-fields-ui
      resolver:
        endpoint: remote-data-fields-api
      title: Remote data fields
      unlicensedAccess:
        - customer
# See: https://developer.atlassian.com/platform/forge/manifest-reference/remotes
remotes:
  - key: data-fields-remote
    baseUrl: ${REMOTE_BASE_URL}
    operations:
      - compute
permissions:
  scopes:
    - write:jira-work
    - read:jira-work
  content:
    styles:
      - unsafe-inline
resources:
  - key: remote-data-fields-ui
    path: resources
