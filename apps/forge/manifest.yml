app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/91e76e8d-752b-417d-8586-71679349e07b
environment:
  variables:
    - REMOTE_BASE_URL
modules:
  # See: https://developer.atlassian.com/platform/forge/manifest-reference/endpoint
  endpoint:
    - key: text-properties-api
      remote: text-properties-remote
  function:
    - key: save-text-properties
      handler: resolvers.handler
  jira:issueContext:
    - key: text-properties
      resource: text-properties-ui
      resolver:
        endpoint: text-properties-api
      title: Remote data fields
      label: Remote data fields
# See: https://developer.atlassian.com/platform/forge/manifest-reference/remotes
remotes:
  - key: text-properties-remote
    baseUrl: ${REMOTE_BASE_URL}
    operations:
      - compute
permissions:
  scopes:
    - write:jira-work
  content:
    styles:
      - unsafe-inline
resources:
  - key: text-properties-ui
    path: resources
