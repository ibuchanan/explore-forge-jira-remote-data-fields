<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text properties</title>
    <style>
      :root {
        color: var(--ds-text, #172b4d);
        font: var(--ds-font-body, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      }

      body { margin: 0; }
      .form { display: grid; gap: var(--ds-space-100, 8px); }
      .answers { margin: 0; padding-left: var(--ds-space-300, 24px); }
      .description, .hint, .message { margin: 0; }
      .description, .hint { color: var(--ds-text-subtle, #44546f); }
      .message { border-radius: var(--ds-radius-small, 3px); padding: var(--ds-space-100, 8px); }
      .error { background: var(--ds-background-danger, #ffebe6); color: var(--ds-text-danger, #ae2e24); }
      .success { background: var(--ds-background-success, #dcfff1); color: var(--ds-text-success, #216e4e); }
      input { border: 1px solid var(--ds-border-input, #8590a2); border-radius: var(--ds-radius-small, 3px); box-sizing: border-box; padding: var(--ds-space-100, 8px); width: 100%; }
      .choices { display: flex; flex-wrap: wrap; gap: var(--ds-space-075, 6px); }
      .button { border: 0; border-radius: var(--ds-radius-small, 3px); cursor: pointer; padding: var(--ds-space-075, 6px) var(--ds-space-100, 8px); }
      .secondary { background: var(--ds-background-neutral, #091e420f); color: var(--ds-text, #172b4d); }
      .primary { background: var(--ds-background-brand-bold, #0c66e4); color: var(--ds-text-inverse, #fff); }
      .button:disabled, input:disabled { cursor: wait; opacity: 0.6; }
    </style>
    <script src="index.js" defer></script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
  </body>
</html>
